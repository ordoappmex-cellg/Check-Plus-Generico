<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando…</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="">
<meta name="twitter:description" content="">
<meta name="twitter:image" content="">
<style>
  :root{
    --l-navy:#182235; --l-accent:#3B6BF5; --l-accent-dark:#2f57d1;
    --l-gray-50:#F9FAFB; --l-gray-100:#F0F2F5; --l-gray-200:#E1E6EE;
    --l-gray-400:#94A0BB; --l-gray-700:#33415C;
    --l-red:#E4483F; --l-red-bg:#FDECEC; --l-green:#0F7A47; --l-green-bg:#E7F7EF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--l-gray-700);background:#fff;font-size:15px;line-height:1.6;
  }
  img{max-width:100%;display:block;}
  h1,h2,h3{color:var(--l-navy);line-height:1.25;margin:0 0 12px;}
  .l-center{text-align:center;padding:60px 20px;color:var(--l-gray-400);font-size:14px;}
  .l-spinner{width:26px;height:26px;border:3px solid var(--l-gray-200);border-top-color:var(--l-accent);border-radius:50%;animation:l-spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes l-spin{to{transform:rotate(360deg);}}

  /* ── Formulario embebido (mismos estilos que form.html, prefijo l-f) ── */
  .l-form-card{background:#fff;border-radius:14px;padding:26px 24px;box-shadow:0 4px 24px rgba(20,30,50,.08);}
  .l-f-title{font-size:18px;font-weight:700;margin:0 0 16px;color:var(--l-navy);}
  .l-f-field{margin-bottom:14px;}
  .l-f-label{display:block;font-size:12px;font-weight:600;color:var(--l-gray-700);margin-bottom:5px;}
  .l-f-label .req{color:var(--l-red);}
  .l-f-input,.l-f-textarea,.l-f-select{
    width:100%;padding:10px 12px;border:1px solid var(--l-gray-200);border-radius:8px;
    font-size:14px;font-family:inherit;color:var(--l-gray-700);background:#fff;
  }
  .l-f-input:focus,.l-f-textarea:focus,.l-f-select:focus{
    outline:none;border-color:var(--l-accent);box-shadow:0 0 0 3px rgba(59,107,245,.12);
  }
  .l-f-textarea{resize:vertical;min-height:80px;}
  /* Honeypot: idéntico criterio que form.html — oculto e inalcanzable para
     una persona, pero un bot que rellena todos los inputs del DOM sí lo
     llena. Si crm_captar_lead lo ve con contenido, descarta el envío. */
  .l-f-honeypot-wrap{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;}
  .l-f-btn{
    width:100%;padding:12px 16px;border:none;border-radius:8px;background:var(--l-accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .l-f-btn:hover{background:var(--l-accent-dark);}
  .l-f-btn:disabled{opacity:.6;cursor:not-allowed;}
  .l-f-msg{padding:11px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .l-f-msg-error{background:var(--l-red-bg);color:#B3261E;}
  .l-gracias{text-align:center;padding:60px 24px;max-width:520px;margin:0 auto;}
  .l-gracias .ti-circle-check{display:none;}
  .l-gracias-icon{width:56px;height:56px;border-radius:50%;background:var(--l-green-bg);color:var(--l-green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px;}
  .l-gracias h1{margin-bottom:10px;}
  .l-gracias p{color:var(--l-gray-700);font-size:15px;}

  /* ── Bloques de servicios/beneficios (compartido, cada plantilla los pinta distinto) ── */
  .l-bloque-titulo{font-size:16px;font-weight:700;color:var(--l-navy);margin:0 0 6px;}
  .l-bloque-texto{font-size:14px;color:var(--l-gray-700);margin:0;white-space:pre-wrap;}

  /* ═══ PLANTILLA: simple — una columna angosta, sin adorno ═══ */
  .l-simple-wrap{max-width:560px;margin:0 auto;padding:36px 20px 60px;}
  .l-simple-cover{border-radius:14px;margin-bottom:22px;max-height:260px;width:100%;object-fit:cover;}
  .l-simple-head{text-align:center;margin-bottom:26px;}
  .l-simple-head h1{font-size:26px;}
  .l-simple-head p{color:var(--l-gray-400);font-size:15px;margin:0;}
  .l-simple-bloques{margin-bottom:26px;}
  .l-simple-bloques .l-bloque{margin-bottom:16px;}

  /* ═══ PLANTILLA: servicios — hero + grid de tarjetas ═══ */
  .l-serv-hero{position:relative;min-height:280px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--l-navy),#2b3c5e);color:#fff;padding:40px 24px;background-size:cover;background-position:center;}
  .l-serv-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,15,25,.75),rgba(10,15,25,.25));}
  .l-serv-hero-inner{position:relative;max-width:920px;margin:0 auto;width:100%;}
  .l-serv-hero h1{color:#fff;font-size:32px;margin-bottom:8px;}
  .l-serv-hero p{color:rgba(255,255,255,.85);font-size:16px;margin:0;max-width:640px;}
  .l-serv-body{max-width:920px;margin:0 auto;padding:44px 24px;}
  .l-serv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:44px;}
  .l-serv-card{background:var(--l-gray-50);border:1px solid var(--l-gray-100);border-radius:12px;padding:20px;}
  .l-serv-card .l-bloque-titulo{color:var(--l-accent);}
  .l-serv-form-wrap{max-width:480px;margin:0 auto;}

  /* ═══ PLANTILLA: evento — hero de pantalla completa, tono oscuro ═══ */
  .l-evt-hero{position:relative;min-height:min(70vh,480px);display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 30% 20%,#3a2b6e,var(--l-navy));color:#fff;padding:60px 24px;background-size:cover;background-position:center;}
  .l-evt-hero::before{content:'';position:absolute;inset:0;background:rgba(10,10,20,.45);}
  .l-evt-hero-inner{position:relative;max-width:680px;}
  .l-evt-hero h1{color:#fff;font-size:36px;margin-bottom:10px;}
  .l-evt-hero p{color:rgba(255,255,255,.85);font-size:17px;margin:0;}
  .l-evt-body{background:var(--l-navy);padding:50px 24px 60px;}
  .l-evt-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start;}
  @media (max-width:720px){.l-evt-inner{grid-template-columns:1fr;}}
  .l-evt-agenda .l-bloque{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.12);}
  .l-evt-agenda .l-bloque:last-child{border-bottom:none;}
  .l-evt-agenda .l-bloque-dot{width:8px;height:8px;border-radius:50%;background:var(--l-accent);margin-top:7px;flex-shrink:0;}
  .l-evt-agenda .l-bloque-titulo,.l-evt-agenda .l-bloque-texto{color:#fff;}
  .l-evt-agenda .l-bloque-texto{color:rgba(255,255,255,.7);}
</style>
</head>
<body>
<div id="l-root">
  <div class="l-center"><div class="l-spinner"></div>Cargando…</div>
</div>
<script>
(function(){
  // Mismas constantes públicas que form.html/index.html — publishable/anon
  // key, diseñada para ir expuesta en el cliente. NUNCA la service_role.
  var SUPABASE_URL='https://xciphoxsalbuficfkkcw.supabase.co';
  var SUPABASE_KEY='sb_publishable__wCFseQLyXOoiA0emNtHoQ_jCFDPu0y';

  var root=document.getElementById('l-root');
  var slug=new URLSearchParams(window.location.search).get('l');

  function esc(s){
    var d=document.createElement('div');
    d.textContent=(s===null||s===undefined)?'':String(s);
    return d.innerHTML;
  }
  function showUnavailable(){
    root.innerHTML='<div class="l-center">Página no disponible.</div>';
  }
  if(!slug){ showUnavailable(); return; }

  // Único punto de contacto con Supabase: RPC ya blindadas (SECURITY DEFINER,
  // sin acceso de lectura directo a ninguna tabla desde el anon key). Mismo
  // helper que form.html.
  function rpc(fn,body){
    return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(body)
    }).then(function(res){
      return res.json().catch(function(){return null;}).then(function(data){
        if(!res.ok){
          var err=new Error((data&&(data.message||data.msg))||'Error de red');
          err.data=data;
          throw err;
        }
        return data;
      });
    });
  }

  var config=null;

  // ── SEO — se actualiza por JS apenas llega la config (ver nota de
  // limitación en el reporte: un crawler que no ejecuta JS no verá esto,
  // solo el <title>/meta genéricos del HTML estático; SSR real requeriría
  // una función edge, fuera de alcance de esta pieza). ──
  function setMeta(sel,attr,val){
    var el=document.querySelector(sel);
    if(el)el.setAttribute(attr,val||'');
  }
  function applySeo(cfg){
    var titulo=cfg.meta_titulo||cfg.titulo||cfg.nombre||'Landing';
    var desc=cfg.meta_descripcion||cfg.subtitulo||'';
    var imagen=cfg.og_imagen_url||cfg.imagen_portada_url||'';
    document.title=titulo;
    setMeta('meta[name="description"]','content',desc);
    setMeta('meta[property="og:title"]','content',titulo);
    setMeta('meta[property="og:description"]','content',desc);
    setMeta('meta[property="og:image"]','content',imagen);
    setMeta('meta[property="og:url"]','content',window.location.href);
    setMeta('meta[name="twitter:title"]','content',titulo);
    setMeta('meta[name="twitter:description"]','content',desc);
    setMeta('meta[name="twitter:image"]','content',imagen);
  }

  // ── Formulario embebido — MISMA lógica de captura que form.html, sin
  // reescribirla: fieldInputHtml/fieldHtml/honeypot/validación/rpc de envío
  // son el mismo fragmento, solo con prefijo l-f- en vez de f- y el destino
  // del POST final es config.formulario.slug (el formulario VINCULADO),
  // nunca el slug de la landing. ──
  function fieldInputHtml(campo){
    var key=campo.key, tipo=campo.tipo||'texto', req=!!campo.obligatorio;
    var id='l-f-field-'+key;
    var reqAttr=req?'required':'';
    if(tipo==='textarea'){
      return '<textarea class="l-f-textarea" id="'+id+'" name="'+esc(key)+'" '+reqAttr+'></textarea>';
    }
    if(tipo==='select'){
      if(Array.isArray(campo.opciones)&&campo.opciones.length){
        var opts='<option value="">— Selecciona —</option>'+campo.opciones.map(function(o){
          var val=(o&&o.value!=null)?o.value:o;
          var lbl=(o&&o.label!=null)?o.label:o;
          return '<option value="'+esc(val)+'">'+esc(lbl)+'</option>';
        }).join('');
        return '<select class="l-f-select" id="'+id+'" name="'+esc(key)+'" '+reqAttr+'>'+opts+'</select>';
      }
      return '<input class="l-f-input" type="text" id="'+id+'" name="'+esc(key)+'" '+reqAttr+'>';
    }
    var inputType=tipo==='email'?'email':(tipo==='tel'?'tel':'text');
    return '<input class="l-f-input" type="'+inputType+'" id="'+id+'" name="'+esc(key)+'" '+reqAttr+'>';
  }
  function fieldHtml(campo){
    var label=campo.label||campo.key;
    var reqMark=campo.obligatorio?' <span class="req">*</span>':'';
    return '<div class="l-f-field"><label class="l-f-label" for="l-f-field-'+campo.key+'">'+esc(label)+reqMark+'</label>'+fieldInputHtml(campo)+'</div>';
  }
  function formHtml(formulario){
    var campos=(formulario&&formulario.campos)||[];
    return '<div class="l-form-card">'+
      '<div class="l-f-title">Contáctanos</div>'+
      '<form id="l-f-form" novalidate>'+
        '<div id="l-f-alert"></div>'+
        campos.map(fieldHtml).join('')+
        '<div class="l-f-honeypot-wrap" aria-hidden="true">'+
          '<label>Deja este campo vacío<input type="text" name="website" id="l-f-honeypot" tabindex="-1" autocomplete="off"></label>'+
        '</div>'+
        '<button type="submit" class="l-f-btn" id="l-f-submit-btn">Enviar</button>'+
      '</form>'+
    '</div>';
  }
  function onSubmit(e){
    e.preventDefault();
    var formulario=config.formulario||{};
    var alertEl=document.getElementById('l-f-alert');
    alertEl.innerHTML='';
    var datos={};
    var missing=[];
    (formulario.campos||[]).forEach(function(campo){
      var el=document.getElementById('l-f-field-'+campo.key);
      var val=el?String(el.value||'').trim():'';
      if(campo.obligatorio&&!val) missing.push(campo.label||campo.key);
      if(val) datos[campo.key]=val;
    });
    if(missing.length){
      alertEl.innerHTML='<div class="l-f-msg l-f-msg-error">Falta completar: '+esc(missing.join(', '))+'.</div>';
      return;
    }
    var honeypotEl=document.getElementById('l-f-honeypot');
    var honeypot=honeypotEl?honeypotEl.value:'';
    var btn=document.getElementById('l-f-submit-btn');
    btn.disabled=true; btn.textContent='Enviando…';
    // p_slug = el slug del FORMULARIO vinculado, nunca el de la landing —
    // crm_captar_lead no sabe nada de landings, solo de formularios.
    rpc('crm_captar_lead',{p_slug:formulario.slug,p_datos:datos,p_honeypot:honeypot}).then(function(resp){
      if(resp&&resp.status==='ok'){
        if(resp.redirect||formulario.redirect_url){
          window.location.href=resp.redirect||formulario.redirect_url;
        }else{
          showGracias();
        }
      }else{
        alertEl.innerHTML='<div class="l-f-msg l-f-msg-error">'+esc((resp&&resp.msg)||'No se pudo enviar. Intenta de nuevo.')+'</div>';
        btn.disabled=false; btn.textContent='Enviar';
      }
    }).catch(function(){
      alertEl.innerHTML='<div class="l-f-msg l-f-msg-error">No se pudo enviar. Intenta de nuevo en un momento.</div>';
      btn.disabled=false; btn.textContent='Enviar';
    });
  }
  function showGracias(){
    var titulo=config.gracias_titulo||'¡Gracias!';
    var texto=config.gracias_texto||'Te contactaremos pronto.';
    root.innerHTML='<div class="l-gracias">'+
      '<div class="l-gracias-icon">✓</div>'+
      '<h1>'+esc(titulo)+'</h1>'+
      '<p>'+esc(texto)+'</p>'+
    '</div>';
  }

  // ── Bloques compartidos — cada plantilla decide el wrapper/clases, el
  // contenido (título+texto) es el mismo dato crudo de config.bloques. ──
  function bloqueHtml(b,variant){
    if(variant==='evento'){
      return '<div class="l-bloque"><div class="l-bloque-dot"></div><div><div class="l-bloque-titulo">'+esc(b.titulo||'')+'</div><p class="l-bloque-texto">'+esc(b.texto||'')+'</p></div></div>';
    }
    if(variant==='servicios'){
      return '<div class="l-serv-card l-bloque"><div class="l-bloque-titulo">'+esc(b.titulo||'')+'</div><p class="l-bloque-texto">'+esc(b.texto||'')+'</p></div>';
    }
    return '<div class="l-bloque"><div class="l-bloque-titulo">'+esc(b.titulo||'')+'</div><p class="l-bloque-texto">'+esc(b.texto||'')+'</p></div>';
  }

  // ── Plantillas — deliberadamente distintas entre sí (ver CSS arriba):
  // simple = una columna angosta; servicios = hero + grid de tarjetas;
  // evento = hero de pantalla completa + agenda oscura. ──
  function renderSimple(cfg){
    var bloques=(cfg.bloques||[]).filter(function(b){return b.titulo||b.texto;});
    root.innerHTML='<div class="l-simple-wrap">'+
      (cfg.imagen_portada_url?'<img class="l-simple-cover" src="'+esc(cfg.imagen_portada_url)+'" alt="">':'')+
      '<div class="l-simple-head"><h1>'+esc(cfg.titulo||'')+'</h1>'+(cfg.subtitulo?'<p>'+esc(cfg.subtitulo)+'</p>':'')+'</div>'+
      (bloques.length?'<div class="l-simple-bloques">'+bloques.map(function(b){return bloqueHtml(b,'simple');}).join('')+'</div>':'')+
      formHtml(cfg.formulario)+
    '</div>';
  }
  function renderServicios(cfg){
    var bloques=(cfg.bloques||[]).filter(function(b){return b.titulo||b.texto;});
    var heroStyle=cfg.imagen_portada_url?' style="background-image:linear-gradient(0deg,rgba(10,15,25,.55),rgba(10,15,25,.15)),url(\''+esc(cfg.imagen_portada_url)+'\')"':'';
    root.innerHTML=
      '<div class="l-serv-hero"'+heroStyle+'><div class="l-serv-hero-inner"><h1>'+esc(cfg.titulo||'')+'</h1>'+(cfg.subtitulo?'<p>'+esc(cfg.subtitulo)+'</p>':'')+'</div></div>'+
      '<div class="l-serv-body">'+
        (bloques.length?'<div class="l-serv-grid">'+bloques.map(function(b){return bloqueHtml(b,'servicios');}).join('')+'</div>':'')+
        '<div class="l-serv-form-wrap">'+formHtml(cfg.formulario)+'</div>'+
      '</div>';
  }
  function renderEvento(cfg){
    var bloques=(cfg.bloques||[]).filter(function(b){return b.titulo||b.texto;});
    var heroStyle=cfg.imagen_portada_url?' style="background-image:url(\''+esc(cfg.imagen_portada_url)+'\')"':'';
    root.innerHTML=
      '<div class="l-evt-hero"'+heroStyle+'><div class="l-evt-hero-inner"><h1>'+esc(cfg.titulo||'')+'</h1>'+(cfg.subtitulo?'<p>'+esc(cfg.subtitulo)+'</p>':'')+'</div></div>'+
      '<div class="l-evt-body"><div class="l-evt-inner">'+
        (bloques.length?'<div class="l-evt-agenda">'+bloques.map(function(b){return bloqueHtml(b,'evento');}).join('')+'</div>':'<div></div>')+
        formHtml(cfg.formulario)+
      '</div></div>';
  }
  function render(cfg){
    config=cfg;
    applySeo(cfg);
    var plantilla=cfg.plantilla||'simple';
    if(plantilla==='servicios')renderServicios(cfg);
    else if(plantilla==='evento')renderEvento(cfg);
    else renderSimple(cfg);
    var formEl=document.getElementById('l-f-form');
    if(formEl)formEl.addEventListener('submit',onSubmit);
  }

  rpc('crm_landing_config',{p_slug:slug}).then(function(cfg){
    if(!cfg||!cfg.formulario){ showUnavailable(); return; }
    render(cfg);
  }).catch(function(){
    showUnavailable();
  });
})();
</script>
</body>
</html>
