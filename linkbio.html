<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando…</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="">
<meta name="twitter:description" content="">
<meta name="twitter:image" content="">
<style>
  :root{
    --b-navy:#182235; --b-accent:#3B6BF5; --b-accent-dark:#2f57d1;
    --b-gray-50:#F9FAFB; --b-gray-100:#F0F2F5; --b-gray-200:#E1E6EE;
    --b-gray-400:#94A0BB; --b-gray-700:#33415C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--b-gray-700);background:var(--b-gray-50);font-size:15px;line-height:1.5;
    min-height:100vh;
  }
  .b-wrap{max-width:420px;margin:0 auto;padding:44px 20px 60px;text-align:center;}
  .b-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;object-fit:cover;background:var(--b-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;}
  .b-title{font-size:20px;font-weight:700;color:var(--b-navy);margin:0 0 6px;}
  .b-bio{font-size:14px;color:var(--b-gray-400);margin:0 0 26px;white-space:pre-wrap;}
  .b-links{display:flex;flex-direction:column;gap:12px;}
  .b-link{
    display:block;width:100%;padding:16px 18px;border-radius:14px;background:#fff;
    border:1px solid var(--b-gray-200);color:var(--b-navy);font-size:15px;font-weight:600;
    text-decoration:none;box-shadow:0 1px 3px rgba(16,17,25,.05);transition:transform .1s,box-shadow .1s;
  }
  .b-link:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,17,25,.08);border-color:var(--b-accent);}
  .b-center{text-align:center;padding:60px 20px;color:var(--b-gray-400);font-size:14px;}
  .b-spinner{width:26px;height:26px;border:3px solid var(--b-gray-200);border-top-color:var(--b-accent);border-radius:50%;animation:b-spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes b-spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="b-root">
  <div class="b-center"><div class="b-spinner"></div>Cargando…</div>
</div>
<script>
(function(){
  // Mismas constantes públicas que form.html/land.html — publishable/anon
  // key, diseñada para ir expuesta en el cliente. NUNCA la service_role.
  var SUPABASE_URL='https://xciphoxsalbuficfkkcw.supabase.co';
  var SUPABASE_KEY='sb_publishable__wCFseQLyXOoiA0emNtHoQ_jCFDPu0y';

  var root=document.getElementById('b-root');
  var qs=new URLSearchParams(window.location.search);
  var slug=qs.get('b');
  // UTM de la URL de entrada — esta página no captura leads (sin formulario),
  // pero se registran igual en la visita, mismo criterio que form.html/land.html.
  var utmSource=qs.get('utm_source');
  var utmMedium=qs.get('utm_medium');
  var utmCampaign=qs.get('utm_campaign');
  // Geolocalización por IP — cortesía analítica, nunca bloqueante. Se dispara
  // ya (sin await) y se referencia en el registro de visita, que encadena su
  // llamada real a geoPromise para no mandarla siempre en null (ver
  // registrarVisita más abajo), sin bloquear el render.
  var geoPais=null, geoCiudad=null, geoLat=null, geoLng=null;
  var geoPromise=(function(){
    var controller=(typeof AbortController!=='undefined')?new AbortController():null;
    var timeoutId=controller?setTimeout(function(){controller.abort();},3000):null;
    return fetch('https://ipapi.co/json/',controller?{signal:controller.signal}:{}).then(function(res){
      return res.json();
    }).then(function(data){
      if(data){
        geoCiudad=data.city||null;
        geoPais=data.country_name||null;
        geoLat=(data.latitude!=null)?data.latitude:null;
        geoLng=(data.longitude!=null)?data.longitude:null;
      }
    }).catch(function(e){ console.warn('geo ipapi:',e); }).then(function(){
      if(timeoutId)clearTimeout(timeoutId);
    });
  })();

  function esc(s){
    var d=document.createElement('div');
    d.textContent=(s===null||s===undefined)?'':String(s);
    return d.innerHTML;
  }
  function showUnavailable(){
    root.innerHTML='<div class="b-center">Página no disponible.</div>';
  }
  if(!slug){ showUnavailable(); return; }

  // Único punto de contacto con Supabase: RPC ya blindadas (SECURITY DEFINER,
  // sin acceso de lectura directo a ninguna tabla desde el anon key). Mismo
  // helper que form.html/land.html.
  function rpc(fn,body){
    return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(body)
    }).then(function(res){
      return res.json().catch(function(){return null;}).then(function(data){
        if(!res.ok){
          var err=new Error((data&&(data.message||data.msg))||'Error de red');
          err.data=data;
          throw err;
        }
        return data;
      });
    });
  }

  // Registro de visita — fire-and-forget, NUNCA bloquea el render ni espera
  // respuesta. referencia = el slug de ESTA página. Dedup con sessionStorage,
  // mismo criterio que form.html/land.html: si falla, se ignora en silencio
  // (console.warn), nunca afecta al visitante.
  (function registrarVisita(){
    if(!slug)return;
    var key='visita_linkbio_'+slug;
    var already=false;
    try{ already=!!sessionStorage.getItem(key); }catch(e){}
    if(already)return;
    // Marca el dedup YA (no espera a geoPromise) — evita una doble llamada si
    // algo más disparara esto de nuevo mientras la geo sigue resolviendo.
    try{ sessionStorage.setItem(key,'1'); }catch(e){}
    // La llamada real espera a que geoPromise resuelva (éxito/falla/timeout,
    // máx. 3s) para poder mandar geo_pais/ciudad/lat/lng — sin esto, siempre
    // irían en null porque el fetch nunca resuelve de forma síncrona. Esto NO
    // bloquea el render de la página, solo retrasa esta llamada de fondo.
    geoPromise.catch(function(){}).then(function(){
      rpc('crm_registrar_visita',{
        p_tipo:'linkbio', p_referencia:slug,
        p_utm_source:utmSource, p_utm_medium:utmMedium, p_utm_campaign:utmCampaign,
        p_geo_pais:geoPais, p_geo_ciudad:geoCiudad, p_geo_lat:geoLat, p_geo_lng:geoLng
      }).catch(function(e){ console.warn('crm_registrar_visita:',e); });
    });
  })();

  // ── SEO — se actualiza por JS apenas llega la config (misma limitación que
  // land.html: un crawler que no ejecuta JS no lo verá; SSR real requeriría
  // una función edge, fuera de alcance aquí). ──
  function setMeta(sel,attr,val){
    var el=document.querySelector(sel);
    if(el)el.setAttribute(attr,val||'');
  }
  function applySeo(cfg){
    var titulo=cfg.titulo||cfg.nombre||'Link en bio';
    var desc=cfg.bio_texto||'';
    var imagen=cfg.avatar_url||'';
    document.title=titulo;
    setMeta('meta[name="description"]','content',desc);
    setMeta('meta[property="og:title"]','content',titulo);
    setMeta('meta[property="og:description"]','content',desc);
    setMeta('meta[property="og:image"]','content',imagen);
    setMeta('meta[property="og:url"]','content',window.location.href);
    setMeta('meta[name="twitter:title"]','content',titulo);
    setMeta('meta[name="twitter:description"]','content',desc);
    setMeta('meta[name="twitter:image"]','content',imagen);
  }

  function initials(nombre){
    return (nombre||'').trim().split(/\s+/).map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();
  }

  // Cada enlace es un <a> normal — SIN lógica de captura, esta página no
  // tiene formulario.
  function render(cfg){
    applySeo(cfg);
    var titulo=cfg.titulo||cfg.nombre||'';
    var enlaces=(cfg.enlaces||[]).filter(function(en){return en&&en.url;});
    root.innerHTML='<div class="b-wrap">'+
      (cfg.avatar_url
        ?'<img class="b-avatar" src="'+esc(cfg.avatar_url)+'" alt="">'
        :'<div class="b-avatar">'+esc(initials(titulo))+'</div>')+
      '<h1 class="b-title">'+esc(titulo)+'</h1>'+
      (cfg.bio_texto?'<p class="b-bio">'+esc(cfg.bio_texto)+'</p>':'')+
      '<div class="b-links">'+
        enlaces.map(function(en){
          return '<a class="b-link" href="'+esc(en.url)+'" target="_blank" rel="noopener">'+esc(en.label||en.url)+'</a>';
        }).join('')+
      '</div>'+
    '</div>';
  }

  rpc('crm_linkbio_config',{p_slug:slug}).then(function(cfg){
    if(!cfg){ showUnavailable(); return; }
    render(cfg);
  }).catch(function(){
    showUnavailable();
  });
})();
</script>
</body>
</html>
